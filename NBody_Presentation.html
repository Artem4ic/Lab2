ize="18.333333333333332" font-weight="400" text-anchor="end"><tspan x="1530.0" dy="0">2 / 2</tspan></text></svg></section></main><footer><div id="caption"></div><small>Схемы фаз, не видеозапись исполнения.<br>Офлайн-презентация · 2 слайда</small></footer><script>let current=0,stage=-1;const slides=[...document.querySelectorAll('.slide')];const stages=[['stage-0','stage-1','stage-2','stage-3'],['force-1','force-2','force-3','update-1','update-2','update-3']];const captions=[['Главный цикл выбирает следующий момент времени и фактический шаг h.','Все пары i<j вычислены по старым координатам; сила даёт два противоположных вклада.','Положение обновляется по старой скорости; новая скорость получает изменение F/m·h.','CSV сохраняет новое состояние; затем начинается следующий шаг до tend.'],['После первого барьера рабочие обнуляют личные массивы и считают свои пары.','После второго барьера частичные силы готовы: можно собирать вклады и менять тела.','После третьего барьера новые состояния готовы. Главный пишет CSV, рабочие ждут следующий старт.']];function render(){slides.forEach((s,i)=>s.classList.toggle('current',i===current));document.getElementById('count').textContent=(current+1)+' / 2';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===1;document.querySelectorAll('.highlight').forEach(e=>e.classList.remove('highlight'));document.getElementById('caption').textContent=stage<0?'Стрелки ← → переключают слайды. «Следующий этап» подсвечивает последовательность работы.':captions[current][stage];if(stage>=0){let tags=current===0?[stages[0][stage]]:stage===0?stages[1].slice(0,3):stage===1?stages[1].slice(3):[];tags.forEach(tag=>slides[current].querySelector('[data-stage="'+tag+'"]').classList.add('highlight'))}}function move(delta){current=Math.max(0,Math.min(1,current+delta));stage=-1;render()}function step(){stage=(stage+1)%(current===0?4:3);render()}document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('step').onclick=step;async function full(){if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}document.getElementById('full').onclick=full;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){move(1)}else if(e.key==='ArrowLeft'){move(-1)}else if(e.key===' '){e.preventDefault();step()}else if(e.key.toLowerCase()==='f'){full()}});render();</script></body></html>
